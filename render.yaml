    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: BASE_URL
        value: https://affiliate-marketing-system-7994.onrender.com
      - key: WORDPRESS_SITE
        value: healthreviewshub5.wordpress.com
      - key: WORDPRESS_CLIENT_ID
        value: "143041"
      - key: WORDPRESS_TOKEN
        sync: false
      - key: WORDPRESS_CLIENT_SECRET
        sync: false
      - key: HOPLINK_JAVABURN
        value: https://45ac8nryoc61fg08luqaycxi1a.hop.clickbank.net
      - key: DATABASE_URL
        fromDatabase:
          name: affiliate-db
          property: connectionString

databases:
  - name: affiliate-db
    region: oregon
    plan: free
